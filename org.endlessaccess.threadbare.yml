id: org.endlessaccess.threadbare
runtime: org.freedesktop.Platform
runtime-version: '26.08'
base: org.godotengine.godot.BaseApp
base-version: '4.7'
sdk: org.freedesktop.Sdk
command: godot-runner
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
modules:
  - name: threadbare
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/endlessm/threadbare/releases/download/v0.2.4/threadbare-v0.2.4-linux-metadata.tar.gz
        sha256: ca0c3bf800c9271665684e453af540a2a04fad8fa84495a8c00dad5ce258c17a
        dest-filename: linux-metadata.tar.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/endlessm/threadbare/releases/latest
          version-query: .tag_name
          url-query: |
            .assets[] | select(.name | endswith("-linux-metadata.tar.gz")) | .browser_download_url

      - type: file
        url: https://github.com/endlessm/threadbare/releases/download/v0.2.4/threadbare-v0.2.4.pck
        sha256: 63206af94097e4d4ad7242bc0103e05aed87f24ab46cd2554cca788a1d855ab5
        dest-filename: godot-runner.pck
        x-checker-data:
          type: json
          url: https://api.github.com/repos/endlessm/threadbare/releases/latest
          is-main-source: true
          version-query: .tag_name
          url-query: |
            .assets[] | select(.name | endswith(".pck")) | .browser_download_url

    build-commands:
      - install -Dm644 godot-runner.pck ${FLATPAK_DEST}/bin/godot-runner.pck

      - linux/install-metadata
