id: org.endlessaccess.threadbare
runtime: org.freedesktop.Platform
runtime-version: '26.08'
base: org.godotengine.godot.BaseApp
base-version: '4.7'
sdk: org.freedesktop.Sdk
command: godot-runner
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
modules:
  - name: threadbare
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/endlessm/threadbare/releases/download/v0.2.5/threadbare-v0.2.5-linux-metadata.tar.gz
        sha256: 4e592a6fa723c729c48e1acae4f87e2c5e44647cfbd03b93adddfa988b3dba12
        dest-filename: linux-metadata.tar.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/endlessm/threadbare/releases/latest
          version-query: .tag_name
          url-query: |
            .assets[] | select(.name | endswith("-linux-metadata.tar.gz")) | .browser_download_url

      - type: file
        url: https://github.com/endlessm/threadbare/releases/download/v0.2.5/threadbare-v0.2.5.pck
        sha256: 2b437065db0543801b79a43342df7e638e3a8f199a130d1fd557774bc23cdaa4
        dest-filename: godot-runner.pck
        x-checker-data:
          type: json
          url: https://api.github.com/repos/endlessm/threadbare/releases/latest
          is-main-source: true
          version-query: .tag_name
          url-query: |
            .assets[] | select(.name | endswith(".pck")) | .browser_download_url

    build-commands:
      - install -Dm644 godot-runner.pck ${FLATPAK_DEST}/bin/godot-runner.pck

      - linux/install-metadata
